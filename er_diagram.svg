<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="100%" height="100%" style="background-color: white; font-family: 'Times New Roman', Times, serif;">
  
  <!-- Crow's Foot Relationship Markers -->
  <defs>
    <marker id="one" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto">
      <line x1="1" y1="1" x2="1" y2="11" stroke="black" stroke-width="1.8"/>
      <line x1="5" y1="1" x2="5" y2="11" stroke="black" stroke-width="1.8"/>
    </marker>
    <marker id="many" markerWidth="14" markerHeight="12" refX="14" refY="6" orient="auto">
      <circle cx="3" cy="6" r="2.5" fill="white" stroke="black" stroke-width="1.5"/>
      <line x1="5.5" y1="6" x2="14" y2="6" stroke="black" stroke-width="1.5"/>
      <line x1="5.5" y1="6" x2="14" y2="1" stroke="black" stroke-width="1.5"/>
      <line x1="5.5" y1="6" x2="14" y2="11" stroke="black" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <text x="550" y="38" font-size="22" font-weight="bold" text-anchor="middle">CakeNKitchen Entity Relationship (ER) Diagram</text>

  <!-- RELATIONSHIP LINES -->
  
  <!-- users (1) to orders (N) -->
  <line x1="160" y1="260" x2="160" y2="350" stroke="black" stroke-width="1.6" marker-start="url(#one)" marker-end="url(#many)"/>
  
  <!-- users (1) to notifications (N) -->
  <path d="M 270 140 L 400 140" fill="none" stroke="black" stroke-width="1.6" marker-start="url(#one)" marker-end="url(#many)"/>

  <!-- categories (1) to cakes (N) -->
  <line x1="930" y1="180" x2="930" y2="250" stroke="black" stroke-width="1.6" marker-start="url(#one)" marker-end="url(#many)"/>
  
  <!-- orders (1) to order_items (N) -->
  <line x1="280" y1="480" x2="420" y2="480" stroke="black" stroke-width="1.6" marker-start="url(#one)" marker-end="url(#many)"/>

  <!-- cakes (1) to order_items (N) -->
  <path d="M 810 360 L 715 360 L 715 480 L 650 480" fill="none" stroke="black" stroke-width="1.6" marker-start="url(#one)" marker-end="url(#many)"/>

  <!-- orders (1) to order_messages (N) -->
  <path d="M 160 600 L 160 670 L 420 670" fill="none" stroke="black" stroke-width="1.6" marker-start="url(#one)" marker-end="url(#many)"/>


  <!-- TABLE 1: users -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="220" height="210" fill="white" stroke="black" stroke-width="2" rx="3"/>
    <rect x="0" y="0" width="220" height="32" fill="white" stroke="black" stroke-width="2" rx="3"/>
    <text x="110" y="22" font-size="15" font-weight="bold" text-anchor="middle">users</text>
    
    <text x="12" y="52" font-size="13" font-weight="bold">PK  user_id (INT)</text>
    <line x1="0" y1="60" x2="220" y2="60" stroke="black" stroke-width="1"/>
    
    <text x="12" y="80" font-size="13">name (VARCHAR)</text>
    <text x="12" y="103" font-size="13">email (VARCHAR) [UNIQUE]</text>
    <text x="12" y="126" font-size="13">phone (VARCHAR)</text>
    <text x="12" y="149" font-size="13">password_hash (VARCHAR)</text>
    <text x="12" y="172" font-size="13">role (ENUM)</text>
    <text x="12" y="195" font-size="13">created_at (TIMESTAMP)</text>
  </g>

  <!-- TABLE 2: notifications -->
  <g transform="translate(400, 50)">
    <rect x="0" y="0" width="230" height="185" fill="white" stroke="black" stroke-width="2" rx="3"/>
    <rect x="0" y="0" width="230" height="32" fill="white" stroke="black" stroke-width="2" rx="3"/>
    <text x="115" y="22" font-size="15" font-weight="bold" text-anchor="middle">notifications</text>
    
    <text x="12" y="52" font-size="13" font-weight="bold">PK  id (INT)</text>
    <line x1="0" y1="60" x2="230" y2="60" stroke="black" stroke-width="1"/>
    
    <text x="12" y="80" font-size="13">FK  user_id (INT, NULL)</text>
    <text x="12" y="103" font-size="13">title (VARCHAR)</text>
    <text x="12" y="126" font-size="13">message (TEXT)</text>
    <text x="12" y="149" font-size="13">is_read (BOOLEAN)</text>
    <text x="12" y="172" font-size="13">created_at (TIMESTAMP)</text>
  </g>

  <!-- TABLE 3: categories -->
  <g transform="translate(810, 50)">
    <rect x="0" y="0" width="240" height="130" fill="white" stroke="black" stroke-width="2" rx="3"/>
    <rect x="0" y="0" width="240" height="32" fill="white" stroke="black" stroke-width="2" rx="3"/>
    <text x="120" y="22" font-size="15" font-weight="bold" text-anchor="middle">categories</text>
    
    <text x="12" y="52" font-size="13" font-weight="bold">PK  cat_id (INT)</text>
    <line x1="0" y1="60" x2="240" y2="60" stroke="black" stroke-width="1"/>
    
    <text x="12" y="80" font-size="13">name (VARCHAR) [UNIQUE]</text>
    <text x="12" y="103" font-size="13">description (TEXT)</text>
    <text x="12" y="122" font-size="13">image_url (VARCHAR)</text>
  </g>

  <!-- TABLE 4: cakes -->
  <g transform="translate(810, 250)">
    <rect x="0" y="0" width="240" height="210" fill="white" stroke="black" stroke-width="2" rx="3"/>
    <rect x="0" y="0" width="240" height="32" fill="white" stroke="black" stroke-width="2" rx="3"/>
    <text x="120" y="22" font-size="15" font-weight="bold" text-anchor="middle">cakes</text>
    
    <text x="12" y="52" font-size="13" font-weight="bold">PK  cake_id (INT)</text>
    <line x1="0" y1="60" x2="240" y2="60" stroke="black" stroke-width="1"/>
    
    <text x="12" y="80" font-size="13">FK  cat_id (INT)</text>
    <text x="12" y="103" font-size="13">name (VARCHAR)</text>
    <text x="12" y="126" font-size="13">description (TEXT)</text>
    <text x="12" y="149" font-size="13">base_price (DECIMAL)</text>
    <text x="12" y="172" font-size="13">image_url (LONGTEXT)</text>
    <text x="12" y="195" font-size="13">is_available (BOOLEAN)</text>
  </g>

  <!-- TABLE 5: orders -->
  <g transform="translate(40, 350)">
    <rect x="0" y="0" width="240" height="250" fill="white" stroke="black" stroke-width="2" rx="3"/>
    <rect x="0" y="0" width="240" height="32" fill="white" stroke="black" stroke-width="2" rx="3"/>
    <text x="120" y="22" font-size="15" font-weight="bold" text-anchor="middle">orders</text>
    
    <text x="12" y="52" font-size="13" font-weight="bold">PK  order_id (INT)</text>
    <line x1="0" y1="60" x2="240" y2="60" stroke="black" stroke-width="1"/>
    
    <text x="12" y="80" font-size="13">FK  user_id (INT, NULL)</text>
    <text x="12" y="100" font-size="13">status (ENUM)</text>
    <text x="12" y="120" font-size="13">total (DECIMAL)</text>
    <text x="12" y="140" font-size="13">delivery_date (DATE)</text>
    <text x="12" y="160" font-size="13">delivery_address (TEXT)</text>
    <text x="12" y="180" font-size="13">latitude &amp; longitude (DECIMAL)</text>
    <text x="12" y="200" font-size="13">delivery_time &amp; type (VARCHAR)</text>
    <text x="12" y="220" font-size="13">payment_method (VARCHAR)</text>
    <text x="12" y="240" font-size="13">created_at (TIMESTAMP)</text>
  </g>

  <!-- TABLE 6: order_items -->
  <g transform="translate(420, 350)">
    <rect x="0" y="0" width="230" height="220" fill="white" stroke="black" stroke-width="2" rx="3"/>
    <rect x="0" y="0" width="230" height="32" fill="white" stroke="black" stroke-width="2" rx="3"/>
    <text x="115" y="22" font-size="15" font-weight="bold" text-anchor="middle">order_items</text>
    
    <text x="12" y="52" font-size="13" font-weight="bold">PK  item_id (INT)</text>
    <line x1="0" y1="60" x2="230" y2="60" stroke="black" stroke-width="1"/>
    
    <text x="12" y="80" font-size="13">FK  order_id (INT)</text>
    <text x="12" y="103" font-size="13">FK  cake_id (INT)</text>
    <text x="12" y="126" font-size="13">qty (INT)</text>
    <text x="12" y="149" font-size="13">weight_lbs (INT)</text>
    <text x="12" y="172" font-size="13">purchase_price (DECIMAL)</text>
    <text x="12" y="195" font-size="13">subtotal (DECIMAL)</text>
    <text x="12" y="213" font-size="13">message (TEXT)</text>
  </g>

  <!-- TABLE 7: order_messages -->
  <g transform="translate(420, 600)">
    <rect x="0" y="0" width="230" height="175" fill="white" stroke="black" stroke-width="2" rx="3"/>
    <rect x="0" y="0" width="230" height="32" fill="white" stroke="black" stroke-width="2" rx="3"/>
    <text x="115" y="22" font-size="15" font-weight="bold" text-anchor="middle">order_messages</text>
    
    <text x="12" y="52" font-size="13" font-weight="bold">PK  id (INT)</text>
    <line x1="0" y1="60" x2="230" y2="60" stroke="black" stroke-width="1"/>
    
    <text x="12" y="80" font-size="13">FK  order_id (INT)</text>
    <text x="12" y="103" font-size="13">sender_role (ENUM)</text>
    <text x="12" y="126" font-size="13">sender_name (VARCHAR)</text>
    <text x="12" y="149" font-size="13">message (TEXT)</text>
    <text x="12" y="170" font-size="13">created_at (TIMESTAMP)</text>
  </g>

</svg>
