<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 720" width="100%" height="100%" style="background-color: white; font-family: 'Times New Roman', Times, serif;">
  <!-- Arrowhead Definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <text x="475" y="35" font-size="20" font-weight="bold" text-anchor="middle">CakeNKitchen 3-Tier System Architecture</text>
  <text x="475" y="55" font-size="13" font-style="italic" text-anchor="middle">Black &amp; White Academic System Architecture Diagram</text>

  <!-- USER Node (Left) -->
  <rect x="25" y="160" width="170" height="150" rx="10" fill="white" stroke="black" stroke-width="2"/>
  <text x="110" y="190" font-size="16" font-weight="bold" text-anchor="middle">Client Tier</text>
  <line x1="35" y1="200" x2="185" y2="200" stroke="black" stroke-width="1"/>
  <text x="40" y="225" font-size="13">• Customer / Guest</text>
  <text x="40" y="250" font-size="13">• Bakery Owner (Admin)</text>
  <text x="40" y="275" font-size="13">• Web Browser Client</text>

  <!-- Arrow Client to Frontend -->
  <line x1="195" y1="235" x2="245" y2="235" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="220" y="225" font-size="11" text-anchor="middle">HTTP/REST</text>

  <!-- FRONTEND TIER -->
  <rect x="255" y="80" width="310" height="320" rx="12" fill="white" stroke="black" stroke-width="2"/>
  <text x="410" y="110" font-size="16" font-weight="bold" text-anchor="middle">Presentation Tier (React.js + Vite)</text>
  <line x1="265" y1="120" x2="555" y2="120" stroke="black" stroke-width="1"/>
  
  <rect x="275" y="135" width="270" height="32" fill="white" stroke="black" stroke-width="1.2"/>
  <text x="410" y="156" font-size="13" text-anchor="middle">Storefront &amp; Custom Cake Builder</text>
  
  <rect x="275" y="177" width="270" height="32" fill="white" stroke="black" stroke-width="1.2"/>
  <text x="410" y="198" font-size="13" text-anchor="middle">GIS Interactive Map Pinning (Leaflet)</text>
  
  <rect x="275" y="219" width="270" height="32" fill="white" stroke="black" stroke-width="1.2"/>
  <text x="410" y="240" font-size="13" text-anchor="middle">Order-Based Chat Component (OrderChat)</text>
  
  <rect x="275" y="261" width="270" height="32" fill="white" stroke="black" stroke-width="1.2"/>
  <text x="410" y="282" font-size="13" text-anchor="middle">Real-Time Notification Toast Engine</text>

  <rect x="275" y="303" width="270" height="32" fill="white" stroke="black" stroke-width="1.2"/>
  <text x="410" y="324" font-size="13" text-anchor="middle">Bakery OS Admin Dashboard</text>

  <rect x="275" y="345" width="270" height="32" fill="white" stroke="black" stroke-width="1.2"/>
  <text x="410" y="366" font-size="13" text-anchor="middle">Axios API Client Services</text>

  <!-- Arrow Frontend to Backend -->
  <line x1="410" y1="400" x2="410" y2="450" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="425" y="430" font-size="12">JSON REST API</text>

  <!-- BACKEND TIER -->
  <rect x="255" y="455" width="310" height="235" rx="12" fill="white" stroke="black" stroke-width="2"/>
  <text x="410" y="482" font-size="16" font-weight="bold" text-anchor="middle">Application Tier (Node.js &amp; Express)</text>
  <line x1="265" y1="492" x2="555" y2="492" stroke="black" stroke-width="1"/>
  
  <rect x="275" y="505" width="270" height="30" fill="white" stroke="black" stroke-width="1.2"/>
  <text x="410" y="525" font-size="12" text-anchor="middle">Catalog &amp; Order Controllers</text>
  
  <rect x="275" y="542" width="270" height="30" fill="white" stroke="black" stroke-width="1.2"/>
  <text x="410" y="562" font-size="12" text-anchor="middle">Message Controller &amp; Discussion API</text>
  
  <rect x="275" y="579" width="270" height="30" fill="white" stroke="black" stroke-width="1.2"/>
  <text x="410" y="599" font-size="12" text-anchor="middle">Notification Controller &amp; Alert Triggers</text>
  
  <rect x="275" y="616" width="270" height="30" fill="white" stroke="black" stroke-width="1.2"/>
  <text x="410" y="636" font-size="12" text-anchor="middle">Auth Middleware &amp; Multer Image Uploads</text>

  <rect x="275" y="653" width="270" height="26" fill="white" stroke="black" stroke-width="1.2"/>
  <text x="410" y="670" font-size="11" text-anchor="middle">MySQL Connection Pool (mysql2)</text>

  <!-- Arrow Backend to Database -->
  <line x1="565" y1="570" x2="635" y2="570" stroke="black" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="600" y="560" font-size="11" text-anchor="middle">SQL Queries</text>

  <!-- DATABASE TIER (Cylinder) -->
  <g transform="translate(645, 220)">
    <path d="M 0 40 L 0 380 A 110 24 0 0 0 240 380 L 240 40 Z" fill="white" stroke="black" stroke-width="2"/>
    <ellipse cx="120" cy="40" rx="120" ry="24" fill="white" stroke="black" stroke-width="2"/>
    
    <text x="120" y="90" font-size="16" font-weight="bold" text-anchor="middle">Database Tier</text>
    <text x="120" y="110" font-size="13" font-style="italic" text-anchor="middle">MySQL (Aiven Cloud / XAMPP)</text>
    <line x1="15" y1="120" x2="225" y2="120" stroke="black" stroke-width="1"/>

    <rect x="20" y="135" width="200" height="28" fill="white" stroke="black" stroke-width="1.2"/>
    <text x="120" y="153" font-size="12" text-anchor="middle">users (Accounts &amp; Roles)</text>

    <rect x="20" y="170" width="200" height="28" fill="white" stroke="black" stroke-width="1.2"/>
    <text x="120" y="188" font-size="12" text-anchor="middle">cakes &amp; categories (Catalog)</text>

    <rect x="20" y="205" width="200" height="28" fill="white" stroke="black" stroke-width="1.2"/>
    <text x="120" y="223" font-size="12" text-anchor="middle">orders &amp; order_items (Orders)</text>

    <rect x="20" y="240" width="200" height="28" fill="white" stroke="black" stroke-width="1.2"/>
    <text x="120" y="258" font-size="12" font-weight="bold" text-anchor="middle">notifications (Real-Time Alerts)</text>

    <rect x="20" y="275" width="200" height="28" fill="white" stroke="black" stroke-width="1.2"/>
    <text x="120" y="293" font-size="12" font-weight="bold" text-anchor="middle">order_messages (Order Chat)</text>

    <text x="120" y="340" font-size="11" font-style="italic" text-anchor="middle">7 Normalized Tables (InnoDB Engine)</text>
  </g>

</svg>
